[package]
name = "auto-chords"
version = "0.1.0"
description = "Auto Chords - visor DAW-like per a acords i estructura"
authors = ["Pep <pepelocotango@gmail.com>"]
edition = "2021"

[lib]
name = "auto_chords_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
