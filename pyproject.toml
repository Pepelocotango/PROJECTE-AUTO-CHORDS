[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-chords"
version = "0.7.0"
description = "De wav a acords: anàlisi (Chordino + Queen Mary) + visor interactiu + wavs llestos per al Live/Reaper"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Pëp", email = "pepelocotango@gmail.com" }]
requires-python = ">=3.10"
# ⚠️ Q9400 sense SSE4.2: numpy<2 obligatori (el 2.x demana x86_64-v2 → SIGILL).
# MATEIXOS PINS que `requirements.txt` (font única de versions; builds
# reproduïbles). Vegeu docs/archive/AUDITORIA_PRODUCCIO.md D.2.
dependencies = [
  "numpy==1.26.4",
  "PyQt5==5.15.11; sys_platform != 'darwin'",
  "PyQt5==5.15.10; sys_platform == 'darwin'",
  # ⚠️ PyQt5-Qt5 per plataforma: la 5.15.19 no té roda Windows (l'última és 5.15.2).
  "PyQt5-Qt5==5.15.2; sys_platform == 'win32'",
  "PyQt5-Qt5==5.15.19; sys_platform != 'win32'",
  "PyQt5_sip==12.19.0",
  "sounddevice==0.5.6",
  "cffi==2.0.0",
]

[project.scripts]
auto-chords = "app.main:main"
wav-a-wavs = "wav_a_wavs:main"

[tool.setuptools.packages.find]
exclude = ["codi_font_chordino*"]
