name: Compilar app macOS (High Sierra 10.13+)

# ── Per DEPURAR ────────────────────────────────────────────────────────────
# · Cada pas imprimeix la seva sortida al log de l'execució.
# · Si alguna cosa falla, l'última passa ("ZZ") imprimeix pistes i "ZZ2" puja
#   els logs com a artefacte `debug-logs-<N>`.
# · Per a MOLT més detall: Settings > Secrets and variables > Actions >
#   `ACTIONS_STEP_DEBUG` = `true`.
# ───────────────────────────────────────────────────────────────────────────

# NOMES MANUAL (workflow_dispatch): GitHub > Actions > Run workflow.
# Construeix l'app de macOS i la deixa com a ARTEFACTE (ZIP). No fa cap push.
#
# ⚠️ `macos-15-intel` es l'ULTIM runner Intel de GitHub Actions (fins a
#    l'agost de 2027). Cal x86_64 perque el desti es High Sierra 10.13.
on:
  workflow_dispatch:      # manual (Actions > Run workflow)
  workflow_call:          # tambe cridable pel workflow agregador (build-all.yml)

# Els workflows NOMES llegeixen el repositori (no hi escriuen mai): el `write`
# queda reservat a `release.yml` i, alla, nomes al job que crea el Release.
permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-15-intel
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.13"   # el minim real de l'app
      PREFIX: ${{ github.workspace }}/.mac-natius
    steps:
      - name: 1. Checkout del codi
        # Les accions es fixen per SHA (amb la versio en comentari): un tag es
        # pot moure, un SHA no.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false

      - name: 1b. Diagnòstic de l'entorn (versió, SDK, disc)
        run: |
          echo "::group::Entorn del runner"
          sw_vers
          uname -m
          clang --version | head -2
          (xcodebuild -version 2>/dev/null | head -2) || true
          echo "python: $(python3 --version)"
          echo "--- disc ---"; df -h .
          echo "--- SDK mínim que accepta el linker ---"
          echo 'int main(){return 0;}' > /tmp/t.c
          clang -mmacosx-version-min=10.13 /tmp/t.c -o /tmp/t && echo "clang accepta -mmacosx-version-min=10.13 OK"
          otool -l /tmp/t | grep -A3 -E "LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX" | head -5
          echo "::endgroup::"

      # ── Python 3.12 (compatible amb 10.13): el Python del runner (3.14) te
      #    minos 15.0 → el paquet NO arrenca a High Sierra. Amb setup-python
      #    3.12 agafem una build més antiga; el guard 2b ho verifica. ────────
      - name: 1c. Python 3.12 (el paquet ha d'arrencar a 10.13)
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"

      # ── ITERACIÓ 1: rodes (el pin crític és PyQt5==5.15.10) ──────────────
      - name: 2. Python + rodes (PyQt5 5.15.10 = últim amb wheel 10.13)
        run: |
          python3 -m venv .venv-mac
          . .venv-mac/bin/activate
          python -m pip install --upgrade pip
          # ⚠️ cffi PINNAT: cffi 2.1.x només publica roda macosx_10_15 (minos
          # 10.15) i el runner (macOS 15) l'agafaria → l'app NO arrencaria a High
          # Sierra. La 2.0.0 sí que té roda macosx_10_13. (El pas 6b ho vigila.)
          pip install "PyQt5==5.15.10" "PyQt5-Qt5==5.15.19" "PyQt5_sip" "numpy<2" "sounddevice" "cffi==2.0.0" pyinstaller
          python - <<'PY'
          import PyQt5, numpy, sys
          from PyQt5 import QtCore
          import sounddevice  # motor d'àudio natiu (PortAudio: CoreAudio)
          print("Python:", sys.version.split()[0])
          print("PyQt5 OK · Qt:", QtCore.QT_VERSION_STR)
          print("numpy:", numpy.__version__)
          print("sounddevice:", sounddevice.__version__,
                "PortAudio:", sounddevice.get_portaudio_version()[1])
          PY
          pip show PyQt5 | grep -E "^(Version|Location)"

      - name: 2b. GUARD — el Python ha de servir per a High Sierra 10.13
        run: |
          . .venv-mac/bin/activate
          PYEXE="$(python -c 'import sys;print(sys.executable)')"
          echo "Python: $PYEXE"
          otool -l "$PYEXE" | grep -A3 -E "LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX" | head -8
          python - <<'PY'
          import re, subprocess, sys
          out = subprocess.run(["otool", "-l", sys.executable],
                               capture_output=True, text=True).stdout
          mb = re.search(r"LC_BUILD_VERSION.*?minos\s+([0-9.]+)", out, re.S)
          mv = re.search(r"LC_VERSION_MIN_MACOSX.*?version\s+([0-9.]+)", out, re.S)
          v = mb.group(1) if mb else (mv.group(1) if mv else "?")
          print("minos del Python:", v)
          try:
              maj = float(".".join(v.split(".")[:2]))
          except ValueError:
              print(f"::error::No s'ha pogut determinar el minos del Python ({v})")
              sys.exit(1)
          if maj > 10.13:
              print(f"::error::El Python te minos {v} (> 10.13): l'app NO "
                    "arrencara a High Sierra")
              sys.exit(1)
          print("OK: Python compatible amb 10.13")
          PY

      # ── ITERACIÓ 2: natius a 10.13 ───────────────────────────────────────
      - name: 3. libvamp-hostsdk + libsndfile (COMPILATS a 10.13)
        run: |
          set -euxo pipefail
          # Versions fixades del projecte (COMMIT dels repos que es compilen).
          . eines/deps_fixades.env
          mkdir -p "$PREFIX"
          # OJO: cal passar -I/-L de $PREFIX tambe al build del vamp-plugin-sdk,
          # perque el seu `make install` compila `host/vamp-simple-host` (un host
          # d'exemple) que fa `#include <sndfile.h>` -> sense -I$PREFIX/include
          # peta amb "fatal error: 'sndfile.h' file not found".
          export CFLAGS="-O2 -mmacosx-version-min=10.13 -I$PREFIX/include"
          export CXXFLAGS="$CFLAGS -stdlib=libc++"
          export CPPFLAGS="-I$PREFIX/include"
          export LDFLAGS="-L$PREFIX/lib -mmacosx-version-min=10.13 -stdlib=libc++"
          # libsndfile (CMake). Sense codecs externs: l'app nomes llegeix WAV i
          # les conversions les fa ffmpeg (aixi evitem arrossegar FLAC/vorbis...).
          # COMMIT FIXAT (deps_fixades.env) i verificat: sense `--depth 1`
          # perque cal poder fer checkout del commit exacte.
          git clone -q https://github.com/libsndfile/libsndfile.git /tmp/libsndfile
          git -C /tmp/libsndfile checkout -q "$LIBSNDFILE_COMMIT"
          [ "$(git -C /tmp/libsndfile rev-parse HEAD)" = "$LIBSNDFILE_COMMIT" ] \
            || { echo "::error::commit de libsndfile no coincideix"; exit 1; }
          cmake -S /tmp/libsndfile -B /tmp/libsndfile/build \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DBUILD_PROGRAMS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_TESTING=OFF \
            -DENABLE_EXTERNAL_LIBS=OFF -DENABLE_MPEG=OFF
          cmake --build /tmp/libsndfile/build -j"$(sysctl -n hw.ncpu)"
          cmake --install /tmp/libsndfile/build
          # vamp-plugin-sdk (autotools)
          git clone -q https://github.com/c4dm/vamp-plugin-sdk.git /tmp/vamp-sdk
          git -C /tmp/vamp-sdk checkout -q "$VAMP_PLUGIN_SDK_COMMIT"
          [ "$(git -C /tmp/vamp-sdk rev-parse HEAD)" = "$VAMP_PLUGIN_SDK_COMMIT" ] \
            || { echo "::error::commit de vamp-plugin-sdk no coincideix"; exit 1; }
          cd /tmp/vamp-sdk
          ./configure --prefix="$PREFIX" --disable-programs
          # `make` tambe compila `host/vamp-simple-host` (host d'exemple) que NO
          # necessitem i que pot fallar en enllacar. Pitjor encara: `make install`
          # NO instal·la res si aquell host falla ("Target 'install' not remade
          # because of errors"). Per tant NO fem servir `install`: comprovem que
          # les LLIBRERIES s'han construït i copiem NOSALTRES libs + headers.
          make -j"$(sysctl -n hw.ncpu)" || true
          [ -f libvamp-sdk.a ]      || { echo "ERROR: no s'ha construït libvamp-sdk.a"; exit 1; }
          [ -f libvamp-hostsdk.a ]  || { echo "ERROR: no s'ha construït libvamp-hostsdk.a"; exit 1; }
          mkdir -p "$PREFIX/lib" "$PREFIX/include/vamp" \
                   "$PREFIX/include/vamp-sdk" "$PREFIX/include/vamp-hostsdk"
          cp -f libvamp-sdk.a libvamp-hostsdk.a "$PREFIX/lib/"
          cp -f vamp/vamp.h "$PREFIX/include/vamp/" 2>/dev/null || true
          cp -f vamp-sdk/*.h "$PREFIX/include/vamp-sdk/"
          cp -f vamp-hostsdk/*.h "$PREFIX/include/vamp-hostsdk/"
          echo "--- verificació del mínim (ha de dir 10.13) ---"
          # Atenció: son fitxers ESTATICS (.a), no .dylib; i si un glob no casa
          # queda el literal -> cal comprovar que el fitxer existeixi.
          for f in "$PREFIX"/lib/*.a "$PREFIX"/lib/*.dylib; do
            [ -e "$f" ] || continue
            echo "== $(basename "$f")"
            otool -l "$f" 2>/dev/null \
              | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX" \
              | grep -E "minos|version" | head -2 || true
          done
          ls -la "$PREFIX/lib/"

      - name: 4. Host Vamp + plugins (a 10.13)
        run: |
          set -euxo pipefail
          export CPATH="$PREFIX/include"
          export LIBRARY_PATH="$PREFIX/lib"
          export MACOSX_DEPLOYMENT_TARGET=10.13
          export CXX=clang++
          # Boost: només calen els HEADERS (el Chordino no enllaça cap .dylib de
          # boost, així que no puja el mínim). La branca macOS del script també el busca.
          brew install boost || brew upgrade boost || true
          # El host (multi-SO: a macOS sense -ldl i amb otool en lloc de ldd)
          ./eines/compila_vamp_host.sh
          # Els plugins (el script detecta el SO sol: branca macOS d'OC-2)
          ./eines/compila_vamp_plugins.sh
          echo "--- minim del host i dels plugins ---"
          for f in vamp_host_local *-macos-local/*.dylib; do
            [ -e "$f" ] || continue
            echo "== $f"
            otool -l "$f" | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX" | grep -E "minos|version" | head -2
          done

      - name: 5. ffmpeg estàtic (evermeet), versió fixada i SHA256 verificat
        run: |
          set -euxo pipefail
          # Versio i hash FIXATS a eines/deps_fixades.env (font unica); abans es
          # baixava amb `getrelease`, que es mou a cada release d'evermeet.
          # ⚠️ El pas 6b (verifica_minos_macos.py) comprova que el paquet no
          # pugi el minim de 10.13: aixo NOMES es pot validar al CI.
          . eines/deps_fixades.env
          mkdir -p portable/bin
          python3 eines/baixa_verificat.py "$FFMPEG_MAC_URL" "$FFMPEG_MAC_SHA256" /tmp/ffmpeg.zip
          unzip -o -q /tmp/ffmpeg.zip -d /tmp/ffm
          cp -f /tmp/ffm/ffmpeg portable/bin/ffmpeg
          chmod +x portable/bin/ffmpeg
          ./portable/bin/ffmpeg -version | head -1

      - name: "5b. Tests unitaris (control de qualitat)"
        run: |
          set +e
          # tests.log a l'espai de treball (no /tmp): així el puja l'artefacte ZZ2.
          # TOTA la suite (discover): inclou tests del motor d'àudio i de plataforma
          # que simulen mac/win amb mocks -> caça bugs abans de provar al Mac.
          QT_QPA_PLATFORM=offscreen .venv-mac/bin/python -m unittest \
            discover -s tests > tests.log 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            cat tests.log
            IDS=$(grep -E "^(FAIL|ERROR):" tests.log | tr '\n' '|' | tr -s ' ' | cut -c1-1800)
            echo "::error::tests FALLEN (rc=$rc) [llista]: $IDS"
            CUA=$(awk 'BEGIN{RS="=======+"} END{print $0}' tests.log | tr '\n' '~' | tr -s ' ' | cut -c1-1800)
            echo "::error::tests FALLEN [ultima traça]: $CUA"
          else
            tail -n 5 tests.log
          fi
          exit "$rc"

      # ── ITERACIÓ 3: empaquetat ───────────────────────────────────────────
      - name: 6. PyInstaller (.app)
        run: |
          set -euxo pipefail
          . .venv-mac/bin/activate
          # ⚠️ CLAU: el launcher fa `from app.main import ...` DINS d'una funció
          # i l'entry és a eines/. Sense `--paths . --paths app`, PyInstaller NO
          # resol `app.main`, NO veu els seus imports i NO empaqueta PyQt5
          # (l'app congelada peta amb "No module named 'PyQt5'"). Ho fa el spec
          # de Windows (pathex=ROOT) però aquí era a faltar.
          pyinstaller --noconfirm --clean --windowed --onedir \
            --name AUTO_CHORDS \
            --icon icona/auto-chords.icns \
            --paths . --paths app \
            --hidden-import app --hidden-import app.main --hidden-import app.visor \
            --hidden-import app.timeline --hidden-import app.timeline_base \
            --hidden-import app.timeline_items --hidden-import app.timeline_layers \
            --hidden-import app.dialegs --hidden-import app.vamp_params \
            --hidden-import app.plataforma --hidden-import app.config \
            --hidden-import app.audio_out --hidden-import sounddevice \
            --hidden-import ffmpeg --hidden-import partitura --hidden-import pipeline \
            --hidden-import postproc --hidden-import theme --hidden-import metronom \
            --add-data "app:app" \
            --add-data "eines:eines" \
            --add-data "icones:icones" \
            --add-data "icona:icona" \
            --add-data "docs:docs" \
            --add-data "nnls-chroma-macos-local:nnls-chroma-macos-local" \
            --add-data "qm-vamp-plugins-macos-local:qm-vamp-plugins-macos-local" \
            --add-data "vamp_host_local:." \
            --add-data "portable:portable" \
            --add-data "acords_a_live.py:." \
            eines/launcher_pyinstaller.py
          ls -la dist/
          echo "--- PyQt5 al bundle? ---"
          find "dist/AUTO_CHORDS.app" -iname "QtCore*" -o -iname "platforms" -type d 2>/dev/null | head

      # ── 6b: cap binari del bundle pot declarar un minos > 10.13 ──────────
      # Comprova TOTS els Mach-O (Python.framework, frameworks de Qt, *.so de
      # numpy/sip, l'executable, els natius, ffmpeg…) només la fatia x86_64.
      # El tag de la roda NO garanteix el minos real; aquest pas sí.
      - name: 6b. Verificació exhaustiva del minos de tot el bundle (x86_64 ≤ 10.13)
        run: |
          set -euxo pipefail
          . .venv-mac/bin/activate
          python eines/verifica_minos_macos.py --max 10.13 --arch x86_64 \
            "dist/AUTO_CHORDS.app"

      # ── 6c: smoke test — l'app EMPAQUETADA ha d'arrencar de debò ─────────
      # Sense GUI (QT_QPA_PLATFORM=offscreen): valida dyld, els plugins de Qt
      # i les dades. Amb AUTO_CHORDS_SMOKE=1 l'app confirma al log que la
      # finestra s'ha creat i surt sola (codi 0).
      - name: 6c. Smoke test — l'app arrenca (headless)
        run: bash eines/smoke_macos.sh "dist/AUTO_CHORDS.app"

      # Si el smoke falla, recompila amb --console per veure el traceback real
      # d'import (l'.app --windowed se'l menja) i l'executa headless.
      - name: "6d. Debug — variant --console per veure el traceback (nomes si el smoke falla)"
        if: failure()
        run: |
          set +e
          . .venv-mac/bin/activate
          pyinstaller --noconfirm --clean --onedir --console --name AC_console \
            --icon icona/auto-chords.icns \
            --paths . --paths app \
            --hidden-import app --hidden-import app.main --hidden-import app.visor \
            --hidden-import app.audio_out --hidden-import sounddevice \
            --add-data "app:app" --add-data "eines:eines" --add-data "icones:icones" \
            --add-data "icona:icona" --add-data "docs:docs" \
            --add-data "nnls-chroma-macos-local:nnls-chroma-macos-local" \
            --add-data "qm-vamp-plugins-macos-local:qm-vamp-plugins-macos-local" \
            --add-data "vamp_host_local:." --add-data "portable:portable" \
            --add-data "acords_a_live.py:." \
            eines/launcher_pyinstaller.py >/dev/null 2>&1
          echo "--- execucio de la variant --console ---"
          AUTO_CHORDS_SMOKE=1 QT_QPA_PLATFORM=offscreen \
            ./dist/AC_console/AC_console 2>&1 | tail -60
          echo "(fi variant console)"

      - name: 7. ZIP (ditto) + verificació de l'executable
        run: |
          set -euxo pipefail
          otool -l "dist/AUTO_CHORDS.app/Contents/MacOS/AUTO_CHORDS" \
            | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX" | grep -E "minos|version" | head -2
          ditto -c -k --sequesterRsrc --keepParent "dist/AUTO_CHORDS.app" "AUTO_CHORDS-macos.zip"
          ls -la AUTO_CHORDS-macos.zip

      # ── 7b: DMG (l'instal·lador típic de macOS) ──────────────────────────
      # Conté l'.app + un enllaç a /Applications. HFS+ (no APFS) per màxima
      # compatibilitat amb High Sierra; UDZO = comprimit.
      - name: 7b. DMG (hdiutil) — instal·lador amb l'.app + enllaç a /Applications
        run: |
          set -euxo pipefail
          STAGE="$(mktemp -d)/dmg"
          mkdir -p "$STAGE"
          cp -R "dist/AUTO_CHORDS.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "AUTO CHORDS" -srcfolder "$STAGE" \
            -ov -format UDZO -fs HFS+ "AUTO_CHORDS-macos.dmg"
          echo "--- munto i verifico el DMG ---"
          MNT="$(mktemp -d)/mnt"
          mkdir -p "$MNT"
          hdiutil attach "AUTO_CHORDS-macos.dmg" -nobrowse -mountpoint "$MNT"
          ls -la "$MNT/"
          test -d "$MNT/AUTO_CHORDS.app" || { echo "::error::el DMG no conté l'.app"; exit 1; }
          test -L "$MNT/Applications"   || { echo "::error::el DMG no conté l'enllaç a /Applications"; exit 1; }
          hdiutil detach "$MNT"
          ls -la AUTO_CHORDS-macos.dmg

      - name: 8. Pujar l'artefacte (ZIP + DMG)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: AUTO_CHORDS-macos-build${{ github.run_number }}
          path: |
            AUTO_CHORDS-macos.zip
            AUTO_CHORDS-macos.dmg
          retention-days: 30

      # Si alguna cosa falla, deixa pistes per depurar.
      - name: "ZZ. Debug si ha fallat"
        if: failure()
        run: |
          echo "::group::Estat en fallar"
          echo "--- disc ---"; df -h . || true
          echo "--- fitxers ---"; ls -la | head -40
          echo "--- arbre de plugins ---"; ls -la *-macos-local/ 2>/dev/null || true
          echo "--- .mac-natius ---"; find .mac-natius -maxdepth 2 2>/dev/null | head -30 || true
          echo "--- dist ---"; ls -la dist/ 2>/dev/null || true
          echo "::endgroup::"

      - name: "ZZ2. Pujar els logs de debug (nomes si falla)"
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: debug-logs-${{ github.run_number }}
          if-no-files-found: ignore
          path: |
            *.log
            smoke_diag.txt
            /tmp/*.log
            build/*/warn-*.txt
