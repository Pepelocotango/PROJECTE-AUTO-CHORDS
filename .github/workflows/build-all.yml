name: Compilar els 3 SO (Linux + Windows + macOS)

# ── AGREGADOR ──────────────────────────────────────────────────────────────
# Un sol workflow que executa els 3 builds de compilacio A LA VEGADA.
# Els crida com a "reusable workflows" (uses: ./.github/workflows/...) i, com
# que son jobs germans, GitHub els llança EN PARAL·LEL (no cal res mes).
#
# NOMES MANUAL (workflow_dispatch): GitHub > Actions > "Compilar els 3 SO" >
# "Run workflow". Cada build deixa el seu artefacte com sempre (Linux AppImage,
# Windows ZIP, macOS ZIP). No fa cap push ni cap Release.
#
# NOTA: perque puguin ser cridats, els 3 workflows tenen tambe `workflow_call:`
# al seu bloc `on:` (a mes de `workflow_dispatch:`).
# ───────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:

# Els workflows NOMES llegeixen el repositori (no hi escriuen mai).
permissions:
  contents: read

# (A.7/B.4) No solapar agregadors: si se'n llança un mentre corre un altre, espera.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inventari:
    # (Bloc 3 · D.5) Que `docs/COMPONENTS_I_VERSIONS.md` estigui AL DIA: es
    # regenera (és determinista, només mira fitxers del repo) i, si difereix
    # del que hi ha commitejat, el job peta → cal córrer
    # `python3 eines/genera_inventari.py` i commitejar-lo.
    name: Inventari al dia (COMPONENTS_I_VERSIONS.md)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout del codi
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      - name: Regenerar i comprovar
        run: |
          set -euo pipefail
          python3 eines/genera_inventari.py
          if ! git diff --exit-code -- docs/COMPONENTS_I_VERSIONS.md; then
            echo "::error::docs/COMPONENTS_I_VERSIONS.md està DESACTUALITZAT: corre 'python3 eines/genera_inventari.py' i commiteja'l."
            exit 1
          fi
          echo "inventari al dia ✔"

  # ⚠️ En un job amb `uses:` (workflow reusable) NOMÉS es permeten les claus:
  # name, uses, with, secrets, strategy, needs, if, concurrency, permissions.
  # `timeout-minutes` NO hi val → GitHub invalida TOT el fitxer. Els timeouts
  # viuen DINS de cada build-*.yml (que és on es fan els passos).
  linux:
    name: Linux (AppImage)
    uses: ./.github/workflows/build-appimage.yml

  windows:
    name: Windows (ZIP portable x64)
    uses: ./.github/workflows/build-windows.yml

  macos:
    name: macOS (High Sierra 10.13+)
    uses: ./.github/workflows/build-macos.yml
