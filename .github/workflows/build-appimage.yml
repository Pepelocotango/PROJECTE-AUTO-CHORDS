name: Compilar AppImage (Linux)

# ── Per DEPURAR ────────────────────────────────────────────────────────────
# · Cada pas imprimeix la seva sortida al log de l'execució.
# · Si alguna cosa falla, l'última passa ("ZZ") imprimeix pistes (disc, fitxers,
#   logs) i "ZZ2" puja els logs com a artefacte `debug-logs-<N>`.
# · Per a MOLT més detall: a GitHub > Settings > Secrets and variables >
#   Actions, crea la variable `ACTIONS_STEP_DEBUG` = `true` (modes verbose).
# · Els scripts (`eines/*.sh`) tenen `set -e` i el seu propi `echo` de progrés.
# ───────────────────────────────────────────────────────────────────────────


# NOMES MANUAL (workflow_dispatch): s'executa quan TU pitges "Run workflow"
# a GitHub > Actions. NO te cap trigger automatic (ni push ni tags ni schedule).
# Construeix l'AppImage i el deixa com a ARTEFACTE descarregable. No fa cap push
# al repositori ni cap Release.
on:
  workflow_dispatch:      # manual (Actions > Run workflow)
  workflow_call:          # tambe cridable pel workflow agregador (build-all.yml)

# Els workflows NOMES llegeixen el repositori (no hi escriuen mai): el `write`
# queda reservat a `release.yml` i, alla, nomes al job que crea el Release.
permissions:
  contents: read

# (A.7/B.4) No solapar execucions del mateix workflow: si se'n llança una mentre
# una altra corre, la nova ESPERA (no es cancel·la res).
# ⚠️ Grup LITERAL, NO `${{ github.workflow }}`: aquest workflow també es crida amb
# `workflow_call` (des de build-all) i allà `github.workflow` és el nom del
# CALLER → caller i cridat compartirien grup → DEADLOCK i cancel·lació.
concurrency:
  group: build-appimage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-appimage:
    # Ubuntu 22.04 (NO 24.04): marca la glibc MINIMA de l'AppImage, perque
    # aqui s'hi COMPILA `vamp_host_local`. Els altres binaris ja son antics:
    # Python portable 2.17, PyQt5/numpy 2.14-2.17, ffmpeg estatic.
    runs-on: ubuntu-22.04
    timeout-minutes: 60          # (B.4) límit d'execució
    steps:
      - name: 1. Checkout del codi
        # Les accions es fixen per SHA (amb la versio en comentari): un tag es
        # pot moure, un SHA no. checkout@v5 i upload-artifact@v6 son les
        # versions que corren en Node 24 (les @v4 donaven l'avis de Node 20).
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false

      - name: 1a. Memòria cau de les baixades verificades
        # `eines/baixa_verificat.py` desa cada fitxer a `.baixades/<sha256>`;
        # aquí es conserva entre execucions. La clau inclou el SO i el contingut
        # de `deps_fixades.env`: si canvia una versió, la cau es renova tota.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: .baixades
          key: deps-${{ runner.os }}-${{ hashFiles('eines/deps_fixades.env') }}

      - name: 1b. Diagnòstic de l'entorn (versions, glibc, disc)
        run: |
          echo "::group::Entorn del runner"
          uname -a
          (lsb_release -a 2>/dev/null) || cat /etc/os-release
          echo "glibc: $(ldd --version | head -1)"
          echo "g++:   $(g++ --version | head -1)"
          echo "python del sistema: $(python3 --version)"
          echo "--- disc ---"; df -h . /tmp
          echo "--- memoria ---"; free -h || true
          echo "::endgroup::"


      - name: 2. Dependències del sistema (headers de Vamp, boost i libsndfile)
        run: |
          sudo apt-get update
          # `vamp-plugin-sdk` es el paquet que porta els HEADERS de Vamp
          # (/usr/include/vamp-hostsdk) + els .so/.a de linkatge; arrossega
          # libvamp-hostsdk3v5 i libvamp-sdk2v5. NO existeix cap paquet
          # `libvamp-hostsdk-dev` (abans hi era i feia fallar el job).
          # NO s'instal·la libfuse2: l'appimagetool duu el runtime modern
          # (type2-runtime) amb libfuse a dins, i l'AppImage resultant tampoc no
          # el necessita. Verificat construint una AppImage amb libfuse2 i
          # libfuse3 amagades.
          sudo apt-get install -y --no-install-recommends \
            vamp-plugin-sdk libboost-dev libsndfile1-dev file

          # Best effort: libreries del `sonic-annotator` (reserva) perque els
          # 3 tests de TTL tambe puguin correr. Si no hi son, es fan SKIP.
          sudo apt-get install -y --no-install-recommends \
            libqt6core6 libqt6xml6 libqt6network6 libglib2.0-0 || true

      - name: 3. Icones de la UI (Lucide)
        run: ./eines/baixa_icones.sh

      - name: "4. Compilar l'host Vamp (glibc del runner = abast de l'AppImage)"
        run: |
          ./eines/compila_vamp_host.sh
          # Els plugins Vamp s'han de compilar AQUI (jammy/GCC 11): els .so del
          # repo son fets a 24.04 (GCC 13) i demanaven GLIBCXX_3.4.32 i glibc
          # 2.38 -> no carregaven ni al runner ni a un desti Ubuntu 22.04.
          ./eines/compila_vamp_plugins.sh

      - name: 5. Python portable + ffmpeg (CPython + PyQt5 + numpy)
        run: |
          ./eines/crea_portable.sh
          # ffmpeg del paquet al PATH (per als tests i qualsevol eina que el cridi)
          echo "$PWD/portable/bin" >> "$GITHUB_PATH"

      - name: "6. Verificació — l'app importa amb el Python portable"
        run: |
          QT_QPA_PLATFORM=offscreen portable/python/bin/python3 -c \
            "import sys; sys.path.insert(0,'.'); from app import main, visor, icones; print('OK imports')"

      - name: 7. Tests (control de qualitat)
        run: |
          # `set -o pipefail` + `tee`: si un test falla, el pas falla I la sortida
          # queda a /tmp/tests.log -> el pas ZZ2 la puja com a artefacte (1 fitxer
          # petit de descarregar, en lloc de tot l'arxiu de logs).
          set -o pipefail
          QT_QPA_PLATFORM=offscreen portable/python/bin/python3 -m unittest \
            discover -s tests 2>&1 | tee /tmp/tests.log

      - name: "7b. Python 3.12 del runner (per a la cobertura)"
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.12'

      - name: "7c. Cobertura de la suite (llindar 65%)"
        # (Bloc 3) Mesura real de cobertura + llindar, en un entorn propi
        # (Python 3.12 + requirements-build) per NO tocar el `portable/`
        # (que només ha de portar els pins de runtime).
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements-build.txt
          QT_QPA_PLATFORM=offscreen python -m coverage run --source=app \
            -m unittest discover -s tests
          python -m coverage report --fail-under=65

      - name: 8. Icona de l'aplicació
        run: portable/python/bin/python3 eines/crea_icona.py

      - name: 9. Construir l'AppImage
        run: |
          SANE=$(echo "${GITHUB_REF_NAME:-local}" | tr '/' '_')
          ./eines/crea_appimage.sh "auto-chords-${SANE}-x86_64.AppImage"
          ls -la *.AppImage

      - name: "9b. Smoke test de l'AppImage (headless)"
        # (A.4) Que l'AppImage ARRENQUI de debò (no només que els imports i els
        # tests passin): s'extreu (sense FUSE) i s'executa amb AUTO_CHORDS_SMOKE=1
        # → la finestra es crea i l'app surt sola (vegeu app/main.py). El missatge
        # «SMOKE: finestra principal creada correctament» va a stderr.
        run: |
          set -euo pipefail
          APP=$(ls auto-chords-*.AppImage | head -1)
          chmod +x "$APP"
          ./"$APP" --appimage-extract >/dev/null 2>&1
          LOG="$(mktemp)"
          AUTO_CHORDS_SMOKE=1 QT_QPA_PLATFORM=offscreen \
            timeout 120 ./squashfs-root/AppRun > "$LOG" 2>&1 || true
          echo "--- sortida del smoke ---"; tail -n 25 "$LOG"
          grep -q "SMOKE: finestra principal creada correctament" "$LOG" \
            || { echo "::error::l'AppImage NO ha superat el smoke test"; exit 1; }
          echo "smoke OK: l'AppImage arrenca"

      - name: 10. Empaquetar (tar.gz canònic — AppImage + README/llicències)
        # Estàndard de Linux per a un binari autocontingut: un tarball `.tar.gz`
        # amb l'executable (l'AppImage) + els docs. Nom canònic:
        #   AutoChords-<versió>-build<NN>-linux-x86_64.tar.gz
        id: prep
        run: |
          VER=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          NOM="AutoChords-${VER}-build${GITHUB_RUN_NUMBER}-linux-x86_64"
          APP="AutoChords-${VER}-x86_64.AppImage"     # nom canònic d'AppImage
          rm -rf paquet && mkdir -p paquet
          cp auto-chords-*.AppImage "paquet/${APP}"
          chmod +x "paquet/${APP}"
          # Al paquet NOMÉS hi va l'imprescindible per a l'usuari: el README i
          # les llicències (la del programa + els avisos de tercers, que són
          # OBLIGATORIS). El CHANGELOG/ROADMAP i tot `docs/` són documentació
          # de desenvolupament: no s'empaqueten.
          cp LICENSE LLICENCIES_TERCERS.md README.md paquet/ 2>/dev/null || true
          tar -C paquet -czf "${NOM}.tar.gz" .
          rm -rf paquet
          ls -la "${NOM}.tar.gz"
          # (A.3) Verificació de CONTINGUT: l'executable + els docs obligatoris.
          echo "--- contingut del .tar.gz ---"; tar -tzf "${NOM}.tar.gz"
          for f in "AutoChords-${VER}-x86_64.AppImage" README.md LICENSE; do
            tar -tzf "${NOM}.tar.gz" | grep -q "/${f}$" \
              || { echo "::error::falta '${f}' al paquet ${NOM}.tar.gz"; exit 1; }
          done
          echo "nom=$NOM" >> "$GITHUB_OUTPUT"

      - name: 11. Pujar l'artefacte
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: ${{ steps.prep.outputs.nom }}
          path: ${{ steps.prep.outputs.nom }}.tar.gz
          retention-days: 30

      # Si alguna cosa falla, deixa pistes per depurar (logs + estat).
      - name: "ZZ. Debug si ha fallat"
        if: failure()
        run: |
          echo "::group::Estat en fallar"
          echo "--- disc ---"; df -h . /tmp || true
          echo "--- fitxers de build ---"; ls -la | head -40
          echo "--- /tmp ---"; ls -la /tmp | head -40
          echo "--- log de l'app ---"; cat auto_chords.log 2>/dev/null | tail -50 || true
          echo "--- log del reproductor ---"; cat temp/visor_player.log 2>/dev/null || true
          echo "::endgroup::"

      - name: "ZZ2. Pujar els logs de debug (nomes si falla)"
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: debug-logs-${{ github.run_number }}
          if-no-files-found: ignore
          path: |
            auto_chords.log
            /tmp/*.log
            /tmp/ac_*
            /tmp/opencode/*.log
