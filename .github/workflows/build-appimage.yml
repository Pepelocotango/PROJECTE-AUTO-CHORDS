name: Compilar AppImage (Linux)

# ── Per DEPURAR ────────────────────────────────────────────────────────────
# · Cada pas imprimeix la seva sortida al log de l'execució.
# · Si alguna cosa falla, l'última passa ("ZZ") imprimeix pistes (disc, fitxers,
#   logs) i "ZZ2" puja els logs com a artefacte `debug-logs-<N>`.
# · Per a MOLT més detall: a GitHub > Settings > Secrets and variables >
#   Actions, crea la variable `ACTIONS_STEP_DEBUG` = `true` (modes verbose).
# · Els scripts (`eines/*.sh`) tenen `set -e` i el seu propi `echo` de progrés.
# ───────────────────────────────────────────────────────────────────────────


# NOMES MANUAL (workflow_dispatch): s'executa quan TU pitges "Run workflow"
# a GitHub > Actions. NO te cap trigger automatic (ni push ni tags ni schedule).
# Construeix l'AppImage i el deixa com a ARTEFACTE descarregable. No fa cap push
# al repositori ni cap Release.
on:
  workflow_dispatch:

jobs:
  build-appimage:
    # Ubuntu 22.04 (NO 24.04): marca la glibc MINIMA de l'AppImage, perque
    # aqui s'hi COMPILA `vamp_host_local`. Els altres binaris ja son antics:
    # Python portable 2.17, PyQt5/numpy 2.14-2.17, ffmpeg estatic.
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Checkout del codi
        uses: actions/checkout@v5

      - name: 1b. Diagnòstic de l'entorn (versions, glibc, disc)
        run: |
          echo "::group::Entorn del runner"
          uname -a
          (lsb_release -a 2>/dev/null) || cat /etc/os-release
          echo "glibc: $(ldd --version | head -1)"
          echo "g++:   $(g++ --version | head -1)"
          echo "python del sistema: $(python3 --version)"
          echo "--- disc ---"; df -h . /tmp
          echo "--- memoria ---"; free -h || true
          echo "::endgroup::"


      - name: 2. Dependències del sistema (compilar l'host + libfuse2)
        run: |
          sudo apt-get update
          # `vamp-plugin-sdk` es el paquet que porta els HEADERS de Vamp
          # (/usr/include/vamp-hostsdk) + els .so/.a de linkatge; arrossega
          # libvamp-hostsdk3v5 i libvamp-sdk2v5. NO existeix cap paquet
          # `libvamp-hostsdk-dev` (abans hi era i feia fallar el job).
          sudo apt-get install -y --no-install-recommends \
            vamp-plugin-sdk libsndfile1-dev libfuse2 file

          # Best effort: libreries del `sonic-annotator` (reserva) perque els
          # 3 tests de TTL tambe puguin correr. Si no hi son, es fan SKIP.
          sudo apt-get install -y --no-install-recommends \
            libqt6core6 libqt6xml6 libqt6network6 libglib2.0-0 || true

      - name: 3. Icones de la UI (Lucide)
        run: ./eines/baixa_icones.sh

      - name: "4. Compilar l'host Vamp (glibc del runner = abast de l'AppImage)"
        run: ./eines/compila_vamp_host.sh

      - name: 5. Python portable + ffmpeg (CPython + PyQt5 + numpy)
        run: ./eines/crea_portable.sh

      - name: "6. Verificació — l'app importa amb el Python portable"
        run: |
          QT_QPA_PLATFORM=offscreen portable/python/bin/python3 -c \
            "import sys; sys.path.insert(0,'.'); from app import main, visor, icones; print('OK imports')"

      - name: 7. Tests (control de qualitat)
        run: |
          QT_QPA_PLATFORM=offscreen portable/python/bin/python3 -m unittest \
            tests.test_pipeline_export

      - name: 8. Icona de l'aplicació
        run: portable/python/bin/python3 eines/crea_icona.py

      - name: 9. Construir l'AppImage
        run: |
          SANE=$(echo "${GITHUB_REF_NAME:-local}" | tr '/' '_')
          ./eines/crea_appimage.sh "auto-chords-${SANE}-x86_64.AppImage"
          ls -la *.AppImage

      - name: 10. Preparar l'artefacte (AppImage + docs)
        id: prep
        run: |
          VER=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          SANE=$(echo "${GITHUB_REF_NAME:-local}" | tr '/' '_')
          NOM="AutoChords_v${VER}-${SANE}-build${GITHUB_RUN_NUMBER}-Linux"
          mkdir -p "$NOM"
          cp auto-chords-*.AppImage "$NOM/"
          cp LICENSE LLICENCIES_TERCERS.md README.md CHANGELOG.md ROADMAP.md "$NOM/" 2>/dev/null || true
          cp -r docs "$NOM/" 2>/dev/null || true
          echo "nom=$NOM" >> "$GITHUB_OUTPUT"

      - name: 11. Pujar l'artefacte
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.prep.outputs.nom }}
          path: ${{ steps.prep.outputs.nom }}/
          retention-days: 30

      # Si alguna cosa falla, deixa pistes per depurar (logs + estat).
      - name: "ZZ. Debug si ha fallat"
        if: failure()
        run: |
          echo "::group::Estat en fallar"
          echo "--- disc ---"; df -h . /tmp || true
          echo "--- fitxers de build ---"; ls -la | head -40
          echo "--- /tmp ---"; ls -la /tmp | head -40
          echo "--- log de l'app ---"; cat auto_chords.log 2>/dev/null | tail -50 || true
          echo "--- log del reproductor ---"; cat temp/visor_player.log 2>/dev/null || true
          echo "::endgroup::"

      - name: "ZZ2. Pujar els logs de debug (nomes si falla)"
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: debug-logs-${{ github.run_number }}
          if-no-files-found: ignore
          path: |
            auto_chords.log
            /tmp/*.log
            /tmp/ac_*
            /tmp/opencode/*.log
