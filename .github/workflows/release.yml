name: Publicar Release (ultims artefactes verds dels 3 SO)
run-name: "Publicar Release ${{ inputs.tag || 'auto' }}"

# ── DRECERA MANUAL «INTEL·LIGENT» ──────────────────────────────────────────
# NO compila res. Detecta QUÈ HI HA i ho aprofita:
#   1) per a cada SO, busca l'ULTIMA execucio VERDA del seu build,
#   2) en baixa l'artefacte directament de GitHub Actions,
#   3) deixa un RESUM (a la pagina de l'execucio) de quina execucio ha agafat,
#   4) crea un RELEASE ESBORRANY amb els paquets que HA TROBAT.
#
# Si un SO no te cap build verd, l'OMET i avisa (no peta), sempre que n'hi hagi
# almenys un. Si no n'hi ha cap, aleshores sí que atura.
#
# NOMES MANUAL (workflow_dispatch). El tag: si el deixes buit, es calcula com
# `v<versio de pyproject.toml>`.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag/versio del Release (p. ex. v0.5.2). Buit = v<versio de pyproject.toml>"
        required: false
        default: ""

permissions:
  contents: write      # crear el Release
  actions: read        # llegir execucions i baixar artefactes

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Checkout (per a les notes)
        uses: actions/checkout@v5

      - name: 2. Determinar el tag
        id: tag
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            VER=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
            TAG="v${VER}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Tag del Release: $TAG"

      - name: 3. Detectar i baixar els ultims artefactes VERDS de cada SO
        id: art
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          TROBATS=0
          {
            echo "## Artifactes agafats"
            echo ""
            echo "| SO | Execucio | Data | Commit |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          declare -A WF=( [linux]=build-appimage [windows]=build-windows [macos]=build-macos )
          for so in linux windows macos; do
            wf="${WF[$so]}"
            info=$(gh run list --workflow "${wf}.yml" --status success --limit 1 \
                     --json databaseId,number,createdAt,headSha \
                     --jq '.[0] | select(. != null) | "\(.databaseId) \(.number) \(.createdAt) \(.headSha[0:7])"')
            if [ -z "$info" ] || [ "$info" = "null" ]; then
              echo "::warning::No hi ha cap execucio VERDA de ${wf}.yml -> s'omet ${so}"
              echo "| ${so} | **cap (omès)** | - | - |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            read -r rid rnum rdate rsha <<< "$info"
            echo "::notice::${so}: agafo l'artefacte de ${wf} run #${rnum} (${rdate}, ${rsha})"
            gh run download "$rid" --dir "dist/${so}"
            echo "| ${so} | #${rnum} | ${rdate} | \`${rsha}\` |" >> "$GITHUB_STEP_SUMMARY"
            TROBATS=$((TROBATS+1))
          done
          echo "trobats=${TROBATS}" >> "$GITHUB_OUTPUT"
          if [ "$TROBATS" = "0" ]; then
            echo "::error::No hi ha cap artefacte verd (ni Linux, ni Windows, ni macOS) -> no es pot fer el Release."
            exit 1
          fi
          echo "--- contingut baixat ---"
          find dist -maxdepth 3 | head -60

      - name: 4. Preparar els fitxers del Release (nomes els SO trobats)
        run: |
          set -euo pipefail
          mkdir -p out
          TAG="${{ steps.tag.outputs.tag }}"
          if [ -d dist/linux ]; then
            find dist/linux -name '*.AppImage' -exec cp {} "out/AutoChords_${TAG}_x86_64.AppImage" \;
          fi
          if [ -d dist/windows ]; then
            wdir=$(find dist/windows -mindepth 1 -maxdepth 1 -type d | head -1)
            ( cd "$wdir" && zip -r -q "$GITHUB_WORKSPACE/out/${TAG}-Windows.zip" . )
          fi
          if [ -d dist/macos ]; then
            mz=$(find dist/macos -name '*.zip' | head -1)
            cp "$mz" "out/${TAG}-macos.zip"
          fi
          echo "--- fitxers del Release ---"
          ls -la out/

      - name: 5. Generar les notes del Release (en catala)
        run: |
          python3 eines/notes_release.py "${{ steps.tag.outputs.ver }}" --fitxer NOTES_RELEASE.md
          head -5 NOTES_RELEASE.md

      - name: 6. Crear el Release (esborrany) amb els paquets disponibles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # IDEMPOTENT: si el Release ja existeix, no el tornem a crear; nomes
          # hi adjuntem/actualitzem els fitxers (--clobber sobreescriu).
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "El Release $TAG ja existeix: hi actualitzo paquets + notes."
            gh release upload "$TAG" out/* --clobber
            gh release edit "$TAG" \
              --title "AUTO CHORDS ${TAG}" \
              --notes-file NOTES_RELEASE.md
          else
            gh release create "$TAG" \
              --title "AUTO CHORDS ${TAG}" \
              --notes-file NOTES_RELEASE.md \
              --draft \
              out/*
            echo "Release esborrany creat. Revisa'l a GitHub > Releases i publica'l."
          fi

      - name: "ZZ. Debug si ha fallat"
        if: failure()
        run: |
          echo "::group::Estat en fallar"
          ls -la || true
          find dist -maxdepth 3 2>/dev/null | head -60 || true
          ls -la out 2>/dev/null || true
          echo "::endgroup::"
