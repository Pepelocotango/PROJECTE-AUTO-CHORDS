name: Publicar Release (Linux)

# ── Per DEPURAR ────────────────────────────────────────────────────────────
# · Cada pas imprimeix la seva sortida al log de l'execució.
# · Si alguna cosa falla, l'última passa ("ZZ") imprimeix pistes (disc, fitxers,
#   logs) i "ZZ2" puja els logs com a artefacte `debug-logs-<N>`.
# · Per a MOLT més detall: a GitHub > Settings > Secrets and variables >
#   Actions, crea la variable `ACTIONS_STEP_DEBUG` = `true` (modes verbose).
# · Els scripts (`eines/*.sh`) tenen `set -e` i el seu propi `echo` de progrés.
# ───────────────────────────────────────────────────────────────────────────


# S'activa NOMES quan puges un tag de versio (p. ex. `git tag v0.5.0`).
# Construeix l'AppImage i crea un RELEASE de GitHub:
#   · titol: AUTO CHORDS v<versio>
#   · cos: en catala, generat de CHANGELOG.md (eines/notes_release.py)
#   · fitxer: l'AppImage
# Es crea com a ESBORRANY (draft): el revises i el publiques tu.
# NO fa cap push al repositori.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write      # necessari per crear el Release

jobs:
  release:
    runs-on: ubuntu-22.04     # marca la glibc minima de l'AppImage
    steps:
      - name: 1. Checkout
        # checkout@v5 i upload-artifact@v6: son les versions que corren en
        # Node 24 (les @v4 donaven l'avis de deprecacio de Node 20).
        uses: actions/checkout@v5

      - name: 1b. Diagnòstic de l'entorn (versions, glibc, disc)
        run: |
          echo "::group::Entorn del runner"
          uname -a
          (lsb_release -a 2>/dev/null) || cat /etc/os-release
          echo "glibc: $(ldd --version | head -1)"
          echo "g++:   $(g++ --version | head -1)"
          echo "python del sistema: $(python3 --version)"
          echo "--- disc ---"; df -h . /tmp
          echo "--- memoria ---"; free -h || true
          echo "::endgroup::"


      - name: 2. Dependències del sistema
        run: |
          sudo apt-get update
          # `vamp-plugin-sdk` porta els HEADERS de Vamp (/usr/include/vamp-hostsdk)
          # + els .so/.a de linkatge; arrossega libvamp-hostsdk3v5 i libvamp-sdk2v5.
          # NO existeix cap paquet `libvamp-hostsdk-dev` (abans hi era i feia
          # fallar el job amb exit 100).
          sudo apt-get install -y --no-install-recommends \
            vamp-plugin-sdk libboost-dev libsndfile1-dev libfuse2 file

          # Best effort: libreries del `sonic-annotator` (reserva) perque els
          # 3 tests de TTL tambe puguin correr. Si no hi son, es fan SKIP.
          sudo apt-get install -y --no-install-recommends \
            libqt6core6 libqt6xml6 libqt6network6 libglib2.0-0 || true

      - name: 3. Icones de la UI (Lucide)
        run: ./eines/baixa_icones.sh

      - name: 4. Compilar l'host Vamp
        run: |
          ./eines/compila_vamp_host.sh
          # Els plugins Vamp s'han de compilar AQUI (jammy/GCC 11): els .so del
          # repo son fets a 24.04 (GCC 13) i demanaven GLIBCXX_3.4.32 i glibc
          # 2.38 -> no carregaven ni al runner ni a un desti Ubuntu 22.04.
          ./eines/compila_vamp_plugins.sh

      - name: 5. Python portable + ffmpeg
        run: |
          ./eines/crea_portable.sh
          # ffmpeg del paquet al PATH (per als tests i qualsevol eina que el cridi)
          echo "$PWD/portable/bin" >> "$GITHUB_PATH"

      - name: 6. Tests
        run: |
          QT_QPA_PLATFORM=offscreen portable/python/bin/python3 -m unittest \
            tests.test_pipeline_export tests.test_partitura

      - name: 7. Icona de l'aplicació
        run: portable/python/bin/python3 eines/crea_icona.py

      - name: 8. Construir l'AppImage
        run: |
          SANE=$(echo "${GITHUB_REF_NAME}" | tr '/' '_')
          ./eines/crea_appimage.sh "AutoChords_${SANE}_x86_64.AppImage"
          ls -la *.AppImage

      - name: 9. Generar les notes del Release (en català)
        run: |
          VER="${GITHUB_REF_NAME#v}"
          python3 eines/notes_release.py "$VER" --fitxer NOTES_RELEASE.md
          head -5 NOTES_RELEASE.md

      - name: 10. Crear el Release (esborrany) amb l'AppImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            --title "AUTO CHORDS v${VER}" \
            --notes-file NOTES_RELEASE.md \
            --draft \
            AutoChords_*.AppImage
          echo "Release esborrany creat. Revisa'l a GitHub > Releases i publica'l."

      # Si alguna cosa falla, deixa pistes per depurar (logs + estat).
      - name: "ZZ. Debug si ha fallat"
        if: failure()
        run: |
          echo "::group::Estat en fallar"
          echo "--- disc ---"; df -h . /tmp || true
          echo "--- fitxers de build ---"; ls -la | head -40
          echo "--- /tmp ---"; ls -la /tmp | head -40
          echo "--- log de l'app ---"; cat auto_chords.log 2>/dev/null | tail -50 || true
          echo "--- log del reproductor ---"; cat temp/visor_player.log 2>/dev/null || true
          echo "::endgroup::"

      - name: "ZZ2. Pujar els logs de debug (nomes si falla)"
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: debug-logs-${{ github.run_number }}
          if-no-files-found: ignore
          path: |
            auto_chords.log
            /tmp/*.log
            /tmp/ac_*
            /tmp/opencode/*.log
