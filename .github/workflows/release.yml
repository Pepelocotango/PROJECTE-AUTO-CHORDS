name: Publicar Release (ultims artefactes verds dels 3 SO)
run-name: "Publicar Release ${{ inputs.tag || 'auto' }}"

# ── DRECERA MANUAL «INTEL·LIGENT» ──────────────────────────────────────────
# NO compila res. Detecta QUÈ HI HA i ho aprofita:
#   1) busca l'ULTIMA execucio VERDA de l'agregador `build-all` (els 3 SO alhora)
#      i, si no n'hi ha, l'ultima verda de cada build solt,
#   2) en baixa els artefactes directament de GitHub Actions,
#   3) deixa un RESUM (a la pagina de l'execucio) d'on els ha agafat,
#   4) crea el RELEASE **PUBLICAT** amb els paquets que HA TROBAT (i crea el tag).
#
# Si un SO no te cap build verd, l'OMET i avisa (no peta), sempre que n'hi hagi
# almenys un. Si no n'hi ha cap, aleshores sí que atura.
#
# NOMES MANUAL (workflow_dispatch). El tag: si el deixes buit, es calcula com
# `v<versio de pyproject.toml>`.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag/versio del Release (p. ex. v0.5.2). Buit = v<versio de pyproject.toml>"
        required: false
        default: ""

# Per defecte NOMES lectura: l'escriptura queda limitada al job que crea el
# Release (minim privilegi).
permissions:
  contents: read

# (A.7/B.4) Un Release alhora.
# ⚠️ Grup LITERAL, NO `${{ github.workflow }}` (per coherència amb la resta i
# per no dependre de com es resolgui en workflows cridats).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write    # NOMES aquest job crea el Release
      actions: read      # llegir execucions i baixar artefactes
    steps:
      - name: 1. Checkout (per a les notes)
        # Les accions es fixen per SHA (amb la versio en comentari): un tag es
        # pot moure, un SHA no.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 2. Determinar el tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            VER=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
            TAG="v${VER}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Tag del Release: $TAG"
          # (A.6) Si el tag/Release JA existeix, avisar ben clar: el flux és
          # idempotent (s'hi actualitzaran els paquets), però NO hauria de passar
          # desapercebut que es re-publica una versió existent.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::warning::El Release '$TAG' JA existeix → s'actualitzarà (idempotent). Comprova la versió de pyproject.toml."
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::warning::Ja hi ha un TAG '$TAG' al repositori."
          fi

      - name: 3. Detectar i baixar els artefactes VERDS (build-all o builds solts)
        id: art
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          TROBATS=0
          {
            echo "## Artifactes agafats"
            echo ""
            echo "| Origen | Execucio | Data |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          # (a) L'agregador 'build-all' te els 3 SO en una sola execucio. Els
          #     builds reusable NO queden registrats com a execucions pròpies,
          #     així que aquest és el camí preferent. (b) Si no n'hi ha cap de
          #     verda, busquem l'última execucio verda de cada build solt.
          BA=$(gh run list --workflow build-all.yml --status success --limit 1 \
                 --json databaseId,number,createdAt \
                 --jq '.[0] | select(. != null) | "\(.databaseId) \(.number) \(.createdAt)"' || true)
          if [ -n "${BA:-}" ] && [ "$BA" != "null" ]; then
            read -r brid bnum bdate <<< "$BA"
            echo "::notice::build-all run #${bnum} (${bdate}) VERD -> en baixo els 3 artefactes"
            gh run download "$brid" --dir dist
            echo "| build-all | #${bnum} | ${bdate} |" >> "$GITHUB_STEP_SUMMARY"
            echo "buildall_n=${bnum}" >> "$GITHUB_OUTPUT"
            TROBATS=3
          else
            declare -A WF=( [linux]=build-appimage [windows]=build-windows [macos]=build-macos )
            for so in linux windows macos; do
              wf="${WF[$so]}"
              info=$(gh run list --workflow "${wf}.yml" --status success --limit 1 \
                       --json databaseId,number,createdAt,headSha \
                       --jq '.[0] | select(. != null) | "\(.databaseId) \(.number) \(.createdAt) \(.headSha[0:7])"')
              if [ -z "$info" ] || [ "$info" = "null" ]; then
                echo "::warning::No hi ha cap execucio VERDA de ${wf}.yml -> s'omet ${so}"
                echo "| ${wf} | cap (omès) | - |" >> "$GITHUB_STEP_SUMMARY"
                continue
              fi
              read -r rid rnum rdate rsha <<< "$info"
              echo "${so}_n=${rnum}" >> "$GITHUB_OUTPUT"
              echo "::notice::${so}: artefacte de ${wf} run #${rnum} (${rdate}, ${rsha})"
              gh run download "$rid" --dir "dist/${so}"
              echo "| ${wf} | #${rnum} | ${rdate} |" >> "$GITHUB_STEP_SUMMARY"
              TROBATS=$((TROBATS+1))
            done
          fi
          echo "trobats=${TROBATS}" >> "$GITHUB_OUTPUT"
          if [ "$TROBATS" = "0" ]; then
            echo "::error::No hi ha cap artefacte verd (ni build-all ni builds solts) -> no es pot fer el Release."
            exit 1
          fi
          echo "--- contingut baixat ---"
          find dist -maxdepth 3 | head -60

      - name: 4. Preparar els fitxers del Release (UN paquet canònic per SO)
        run: |
          set -euo pipefail
          mkdir -p out
          TAG="${{ steps.tag.outputs.tag }}"
          VER="${TAG#v}"
          # Nom FINAL canònic: AutoChords-<versió del tag>-build<NN>-<plataforma>.<ext>
          # El número de build es dedueix del nom de l'artefacte (porta '-build<NN>').
          # Els paquets JA venen fets dels builds (exe + docs a dins): aquí només
          # se'ls posa el nom final amb la VERSIÓ DEL TAG.
          BALL="${{ steps.art.outputs.buildall_n }}"
          n_art() {  # $1 = patró del directori de l'artefacte -> el <NN> de build
            local d; d=$(find dist -maxdepth 2 -type d -iname "$1" 2>/dev/null | head -1)
            if [ -n "$d" ]; then basename "$d" | sed -n 's/.*-build\([0-9][0-9]*\)-.*/\1/p'; fi
          }
          BL="$(n_art '*linux*')"; BW="$(n_art '*win*')"; BM="$(n_art '*macos*')"
          [ -z "$BL" ] && BL="$BALL"
          [ -z "$BW" ] && BW="$BALL"
          [ -z "$BM" ] && BM="$BALL"
          # 🐧 Linux: tar.gz (conté l'AppImage + docs)
          f=$(find dist -name '*.tar.gz' | head -1)
          if [ -n "$f" ]; then cp "$f" "out/AutoChords-${VER}-build${BL}-linux-x86_64.tar.gz"; fi
          # 🪟 Windows: zip (conté AutoChords.exe + _internal/ + docs a l'arrel)
          f=$(find dist -iname '*.zip' | grep -iv macos | head -1)
          if [ -n "$f" ]; then cp "$f" "out/AutoChords-${VER}-build${BW}-win-x64.zip"; fi
          # 🍎 macOS: dmg (conté l'.app + docs)
          f=$(find dist -iname '*.dmg' | head -1)
          if [ -n "$f" ]; then cp "$f" "out/AutoChords-${VER}-build${BM}-macos-x86_64.dmg"; fi
          echo "--- fitxers del Release ---"
          ls -la out/
          test "$(find out -maxdepth 1 -type f | wc -l)" -gt 0 \
            || { echo "::error::cap paquet trobat a dist/ (builds antics?)"; exit 1; }

      - name: 5. Generar les notes del Release (en catala)
        run: |
          python3 eines/notes_release.py "${{ steps.tag.outputs.ver }}" --fitxer NOTES_RELEASE.md
          head -5 NOTES_RELEASE.md

      - name: 5b. Generar SHA256SUMS.txt (la «petjada» dels paquets)
        run: |
          set -euo pipefail
          # Qui baixa un paquet pot comprovar que es EXACTAMENT el que hem
          # publicat:  sha256sum -c SHA256SUMS.txt
          cd out
          find . -type f ! -name 'SHA256SUMS.txt' -print0 \
            | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt
          echo "--- SHA256SUMS.txt ---"; cat SHA256SUMS.txt

      - name: 6. Crear el Release PUBLICAT amb els paquets disponibles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # IDEMPOTENT: si el Release ja existeix, no el tornem a crear; nomes
          # hi adjuntem/actualitzem els fitxers (--clobber sobreescriu) i el
          # PUBLIQUEM si encara era esborrany (--draft=false).
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "El Release $TAG ja existeix: hi actualitzo paquets + notes + el publico."
            gh release upload "$TAG" out/* --clobber
            gh release edit "$TAG" \
              --draft=false \
              --title "AUTO CHORDS ${TAG}" \
              --notes-file NOTES_RELEASE.md
            echo "Release ${TAG} PUBLICAT."
          else
            gh release create "$TAG" \
              --title "AUTO CHORDS ${TAG}" \
              --notes-file NOTES_RELEASE.md \
              out/*
            echo "Release ${TAG} PUBLICAT (ja no queda com a esborrany)."
          fi

      - name: "ZZ. Debug si ha fallat"
        if: failure()
        run: |
          echo "::group::Estat en fallar"
          ls -la || true
          find dist -maxdepth 3 2>/dev/null | head -60 || true
          ls -la out 2>/dev/null || true
          echo "::endgroup::"
