  <rect x="1064" y="786" width="14" height="14" rx="3" fill="#2563eb"/>
  <text x="1086" y="797" fill="#dbe2ec" font-size="11">fila seleccionada</text>
  <rect x="1064" y="808" width="14" height="14" rx="3" fill="#101216" stroke="#ffb26b" stroke-width="2"/>
