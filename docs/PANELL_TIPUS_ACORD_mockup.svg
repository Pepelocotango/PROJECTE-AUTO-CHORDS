    <text x="42" y="595" fill="#dbe2ec">   6/9</text>
    <text x="42" y="613" fill="#dbe2ec">   7b9</text>
    <text x="42" y="631" fill="#dbe2ec">   …   (fins als avançats)</text>
  </g>
  <!-- barra de desplaçament -->
