    <text x="330" y="464">4.1.1   A-Maj7/G#</text>
    <text x="330" y="480">5.1.1   A-7/G</text>
    <text x="330" y="496">6.1.1   A-6/F#</text>
    <text x="330" y="512">7.1.1   A-</text>
    <text x="330" y="528">8.1.1   C</text>
  </g>
