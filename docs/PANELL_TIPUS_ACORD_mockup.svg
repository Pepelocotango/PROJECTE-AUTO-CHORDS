  <!-- dock Log · Informació -->
  <rect x="34" y="694" width="974" height="112" rx="6" fill="#12151a" stroke="#2a2c30"/>
  <rect x="34" y="694" width="974" height="22" rx="6" fill="#22242a"/>
  <text x="44" y="709" fill="#e6ecf5" font-size="11" font-weight="600">Log  ·  Informació</text>
  <text x="44" y="734" fill="#9aa4b2" font-size="10" font-family="ui-monospace,Menlo,Consolas,monospace">[VISOR] desat CSV …/AUTOCHORDS_03/acords.csv</text>
  <text x="44" y="750" fill="#9aa4b2" font-size="10" font-family="ui-monospace,Menlo,Consolas,monospace">[VISOR] reanomenats 3 acord(s) → A-7/G</text>
  <text x="44" y="766" fill="#8ad3a5" font-size="10" font-family="ui-monospace,Menlo,Consolas,monospace">[UI] editor: acord 4 → Ab6add9/Db @ 10.29s</text>

  <!-- barra d'estat -->
  <rect x="20" y="812" width="1000" height="28" rx="10" fill="#1a1c20"/>
  <rect x="20" y="812" width="1000" height="12" fill="#1a1c20"/>
  <text x="36" y="831" fill="#9aa4b2" font-size="11">Llest</text>
  <rect x="900" y="819" width="100" height="10" rx="3" fill="#2a2c30"/>
  <rect x="900" y="819" width="70" height="10" rx="3" fill="#2563eb"/>

  <!-- ═══════════════ LLEGENDA ═══════════════ -->
  <rect x="1040" y="20" width="380" height="820" rx="10" fill="#14161a" stroke="#2e333a"/>
  <text x="1064" y="52" fill="#edf3ff" font-size="17" font-weight="700">Panell «Tipus d'acord»</text>
  <text x="1064" y="74" fill="#8fa0b5" font-size="12">Mockup · per aprovar abans del codi</text>
  <line x1="1064" y1="88" x2="1396" y2="88" stroke="#2e333a"/>

  <text x="1064" y="116" fill="#ffb26b" font-size="13" font-weight="700">Com funciona</text>
  <g font-size="12.5" fill="#dbe2ec">
    <text x="1064" y="142">1. Escriu l'<tspan font-weight="700">Arrel</tspan> i, si vols, el <tspan font-weight="700">Baix</tspan>.</text>
    <text x="1078" y="160" fill="#8fa0b5" font-size="11">(text lliure — pots deixar-los buits)</text>
    <text x="1064" y="186">2. Clica el <tspan font-weight="700">tipus</tspan> a la llista.</text>
    <text x="1078" y="204" fill="#8fa0b5" font-size="11">(plana, de menys a més complex)</text>
    <text x="1064" y="230">3. El nom apareix a la casella <tspan font-weight="700">«Nom»</tspan></text>
    <text x="1078" y="248" fill="#8fa0b5" font-size="11">de l'editor (finestra taronja).</text>
    <text x="1064" y="274">4. Prem <tspan font-weight="700">«Aplica»</tspan> (o Enter) quan vulguis.</text>
  </g>

  <line x1="1064" y1="294" x2="1396" y2="294" stroke="#2e333a"/>
  <text x="1064" y="320" fill="#ffb26b" font-size="13" font-weight="700">Comportament (les teves 5 respostes)</text>
  <g font-size="12" fill="#dbe2ec">
    <text x="1064" y="346">• Clicar un tipus <tspan font-weight="700">NOMÉS omple</tspan> la casella.</text>
    <text x="1078" y="363" fill="#8fa0b5" font-size="11">No aplica res — tu prems Aplica.</text>
    <text x="1064" y="387">• La llista mostra <tspan font-weight="700">només el tipus</tspan>.</text>
    <text x="1064" y="411">• Arrel i Baix són <tspan font-weight="700">camps de text lliures</tspan>.</text>
    <text x="1064" y="435">• <tspan font-weight="700">Sense arrel</tspan> → la casella rep només el</text>
    <text x="1078" y="452" fill="#8fa0b5" font-size="11">tipus (p. ex. «Maj7») i tu l'acabes.</text>
    <text x="1064" y="476">• Amb arrel i baix → composa i canonicalitza:</text>
    <text x="1078" y="494" fill="#8ad3a5" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace">Ab + 6/9 + Db → Ab6add9/Db</text>
  </g>

  <line x1="1064" y1="514" x2="1396" y2="514" stroke="#2e333a"/>
  <text x="1064" y="540" fill="#ffb26b" font-size="13" font-weight="700">Detalls d'ubicació</text>
  <g font-size="12" fill="#dbe2ec">
    <text x="1064" y="566">• Panell <tspan font-weight="700">vertical a l'ESQUERRA</tspan>, com una</text>
    <text x="1078" y="583" fill="#8fa0b5" font-size="11">caixa tipus Log/Informació.</text>
    <text x="1064" y="607">• <tspan font-weight="700">Desacoplable</tspan> (es pot treure com a</text>
    <text x="1078" y="624" fill="#8fa0b5" font-size="11">finestra flotant) i ocultable.</text>
    <text x="1064" y="648">• Entrada al menú <tspan font-weight="700">Visualitza</tspan>:</text>
    <text x="1078" y="665" fill="#8fa0b5" font-size="11">«Mostra els tipus d'acord».</text>
    <text x="1064" y="689">• Tipus de la <tspan font-weight="700">font única</tspan> <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">xifrat.TIPUS</tspan>:</text>
    <text x="1078" y="706" fill="#8fa0b5" font-size="11">si s'hi afegeix un tipus, hi surt sol.</text>
  </g>

  <line x1="1064" y1="726" x2="1396" y2="726" stroke="#2e333a"/>
  <text x="1064" y="752" fill="#8fa0b5" font-size="11">Llegenda de color:</text>
  <rect x="1064" y="762" width="14" height="14" rx="3" fill="#2563eb"/>
  <text x="1086" y="773" fill="#dbe2ec" font-size="11">fila del tipus seleccionat</text>
  <rect x="1064" y="784" width="14" height="14" rx="3" fill="#0f1013" stroke="#ffb26b" stroke-width="2"/>
  <text x="1086" y="795" fill="#dbe2ec" font-size="11">casella «Nom» que s'omple</text>
  <rect x="1064" y="806" width="14" height="14" rx="3" fill="#17181c" stroke="#2563eb" stroke-width="2"/>
  <text x="1086" y="817" fill="#dbe2ec" font-size="11">panell nou (desacoplable)</text>
</svg>
