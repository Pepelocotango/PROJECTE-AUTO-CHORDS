  <!-- ═══════════════ LLEGENDA ═══════════════ -->
  <rect x="1040" y="20" width="380" height="820" rx="10" fill="#14161a" stroke="#2e333a"/>
  <text x="1064" y="52" fill="#edf3ff" font-size="17" font-weight="700">Panell «Tipus d'acord»</text>
  <text x="1064" y="74" fill="#8fa0b5" font-size="12">Mockup v3 · tipus + variants (sense espais) + graus (sense parèntesis)</text>
  <line x1="1064" y1="88" x2="1396" y2="88" stroke="#2e333a"/>

  <text x="1064" y="114" fill="#ffb26b" font-size="13" font-weight="700">Cada fila de la llista</text>
  <rect x="1064" y="126" width="316" height="34" rx="4" fill="#101216" stroke="#2e333a"/>
  <rect x="1066" y="128" width="312" height="30" fill="#1b1f26"/>
  <text x="1074" y="143" font-size="12"><tspan fill="#edf3ff" font-weight="700">maj7</tspan><tspan fill="#7fd1a0" font-size="10">·M7·Ma7·Δ7</tspan></text>
  <text x="1074" y="155" fill="#7d8794" font-size="9">1,3,5,7</text>
  <text x="1064" y="178" fill="#dbe2ec" font-size="11.5">
    <tspan fill="#7fd1a0">verd</tspan> = noms alternatius · <tspan fill="#7d8794">gris</tspan> = graus</text>
  <text x="1064" y="196" fill="#8fa0b5" font-size="11">Sense parèntesis: els graus, separats per comes.</text>
  <text x="1064" y="214" fill="#8fa0b5" font-size="11">El símbol Δ (= triangle) es pot copiar del panell.</text>

  <line x1="1064" y1="228" x2="1396" y2="228" stroke="#2e333a"/>
  <text x="1064" y="254" fill="#ffb26b" font-size="13" font-weight="700">Com funciona</text>
  <g font-size="12.5" fill="#dbe2ec">
    <text x="1064" y="280">1. Escriu l'<tspan font-weight="700">Arrel</tspan> i, si vols, el <tspan font-weight="700">Baix</tspan>.</text>
    <text x="1078" y="298" fill="#8fa0b5" font-size="11">(text lliure — pots deixar-los buits)</text>
    <text x="1064" y="324">2. Clica el <tspan font-weight="700">tipus</tspan> a la llista.</text>
    <text x="1078" y="342" fill="#8fa0b5" font-size="11">(plana, de menys a més complex)</text>
    <text x="1064" y="368">3. El nom apareix a la casella <tspan font-weight="700">«Nom»</tspan></text>
    <text x="1078" y="386" fill="#8fa0b5" font-size="11">de l'editor (finestra taronja).</text>
    <text x="1064" y="412">4. Prem <tspan font-weight="700">«Aplica»</tspan> (o Enter) quan vulguis.</text>
  </g>

  <line x1="1064" y1="432" x2="1396" y2="432" stroke="#2e333a"/>
  <text x="1064" y="458" fill="#ffb26b" font-size="13" font-weight="700">Comportament (les teves 5 respostes)</text>
  <g font-size="12" fill="#dbe2ec">
    <text x="1064" y="482">• Clicar un tipus <tspan font-weight="700">NOMÉS omple</tspan> la casella.</text>
    <text x="1064" y="506">• La llista mostra <tspan font-weight="700">només el tipus</tspan>.</text>
    <text x="1064" y="530">• Arrel i Baix són <tspan font-weight="700">camps de text lliures</tspan>.</text>
    <text x="1064" y="554">• <tspan font-weight="700">Sense arrel</tspan> → la casella rep només el</text>
    <text x="1078" y="571" fill="#8fa0b5" font-size="11">tipus (p. ex. «maj7») i tu l'acabes.</text>
    <text x="1064" y="595">• Amb arrel i baix → composa i canonicalitza:</text>
    <text x="1078" y="613" fill="#8ad3a5" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace">Ab + maj7 + Db → AbMaj7/Db</text>
  </g>

  <line x1="1064" y1="632" x2="1396" y2="632" stroke="#2e333a"/>
  <text x="1064" y="658" fill="#ffb26b" font-size="13" font-weight="700">Ubicació i detalls</text>
  <g font-size="12" fill="#dbe2ec">
    <text x="1064" y="682">• Panell <tspan font-weight="700">vertical a l'ESQUERRA</tspan> (com el log).</text>
    <text x="1064" y="706">• <tspan font-weight="700">Desacoplable</tspan> (finestra flotant) i ocultable.</text>
    <text x="1064" y="730">• Menú <tspan font-weight="700">Visualitza</tspan>: «Mostra els tipus d'acord».</text>
    <text x="1064" y="754">• Tipus de la <tspan font-weight="700">font única</tspan> <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">xifrat.TIPUS</tspan>.</text>
  </g>

