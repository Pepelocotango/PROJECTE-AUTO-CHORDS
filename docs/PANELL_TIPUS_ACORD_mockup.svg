  <rect x="320" y="276" width="180" height="30" rx="5" fill="#3a4655" stroke="#dfe7f5"/>
  <text x="410" y="296" fill="#edf3ff" font-size="10" text-anchor="middle">INTRO · B</text>
  <rect x="504" y="276" width="220" height="30" rx="5" fill="#475a70" stroke="#dfe7f5"/>
  <text x="614" y="296" fill="#edf3ff" font-size="10" text-anchor="middle">VEU A · C</text>
